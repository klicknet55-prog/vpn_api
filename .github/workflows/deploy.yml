name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /opt/vpn_api

            if [ -z "${{ secrets.GH_REPO_TOKEN }}" ]; then
              echo "GH_REPO_TOKEN secret is required for private repository access"
              exit 1
            fi

            # Use token only for this fetch command (no token persisted to git config)
            AUTH_HEADER=$(printf "x-access-token:%s" "${{ secrets.GH_REPO_TOKEN }}" | base64 | tr -d '\n')
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" fetch https://github.com/klicknet55-prog/vpn_api.git main
            git reset --hard FETCH_HEAD

            # Install/update dependencies
            /opt/vpn_api/.venv/bin/pip install -r requirements.txt --quiet

            # Restart API service
            systemctl restart vpn-api
            systemctl is-active --quiet vpn-api && echo "Service OK" || (journalctl -u vpn-api -n 20 --no-pager; exit 1)
